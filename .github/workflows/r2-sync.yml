
name: Auto-Sync R2 to movies.json

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: r2-movie-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Required Files
        run: |
          test -f generate_movies_json.py || {
            echo "ERROR: generate_movies_json.py not found"
            exit 1
          }
          test -f generate_sitemap.py || {
            echo "ERROR: generate_sitemap.py not found"
            exit 1
          }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Validate R2 Secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          python - <<'PY'
          import os
          required = [
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET_NAME",
              "R2_ENDPOINT_URL"
          ]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("All required R2 secrets are configured.")
          PY

      - name: Run R2 Sync Script
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: python generate_movies_json.py

      - name: Generate Sitemap
        run: python generate_sitemap.py

      - name: Check Generated Files
        run: |
          test -s movies.json || {
            echo "ERROR: movies.json is empty or missing"
            exit 1
          }
          test -s sitemap.xml || {
            echo "ERROR: sitemap.xml is empty or missing"
            exit 1
          }
          echo "Generated files verified."

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add movies.json sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update movies.json and sitemap.xml from R2"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes detected. Nothing to commit."
          fi
