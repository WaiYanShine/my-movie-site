<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drsamangyi - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; overflow-y: scroll; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 5px; }

        header { 
            background: #1f1f1f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            border-bottom: 1px solid #333; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { 
            font-size: 20px; 
            font-weight: bold; 
            color: #e50914; 
            text-decoration: none; 
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: #fff; text-decoration: none; font-size: 14px; transition: 0.3s; white-space: nowrap; }
        nav a:hover, nav a.active { color: #e50914; }

        @media (max-width: 480px) {
            header { padding: 12px 15px; }
            .logo { font-size: 18px; }
            nav { gap: 10px; }
            nav a { font-size: 13px; }
        }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        
        .filter-section {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .search-box { flex: 1; min-width: 250px; }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: #e50914; }

        .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-options select {
            padding: 10px 15px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .filter-options select:focus { outline: none; border-color: #e50914; }

        .section-title { margin-bottom: 25px; font-size: 1.8rem; border-left: 4px solid #e50914; padding-left: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #e50914; font-size: 14px; padding: 4px 10px; border-radius: 20px; }

        .movie-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .movie-grid { grid-template-columns: repeat(6, 1fr); } }

        .movie-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.3s; text-decoration: none; color: inherit; display: block; }
        .movie-card:hover { transform: translateY(-8px); box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3); }
        .movie-card img { width: 100%; height: 280px; object-fit: cover; }
        .movie-info { padding: 12px; }
        .movie-info h3 { font-size: 1rem; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; justify-content: space-between; color: #aaa; font-size: 0.85rem; }
        .rating { color: #ffc107; font-weight: bold; }

        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 40px; gap: 10px; }
        .pagination a, .pagination span { background: #1f1f1f; color: #fff; padding: 10px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; transition: 0.3s; border: 1px solid #333; cursor: pointer; }
        .pagination a:hover, .pagination .active { background: #e50914; border-color: #e50914; }

        footer { text-align: center; padding: 25px; background: #1f1f1f; color: #777; margin-top: 50px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 drsamangyi</a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="movies.html">Movies</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies by name..." oninput="filterMovies()">
            </div>
            <div class="filter-options">
                <select id="sortFilter" onchange="filterMovies()">
                    <option value="latest">Sort: Latest</option>
                    <option value="top_rated">Sort: Top Rated</option>
                    <option value="most_viewed">Sort: Most Viewed</option>
                </select>
                <select id="categoryFilter" onchange="filterMovies()">
                    <option value="all">All Categories</option>
                    <option value="Action">Action</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Drama">Drama</option>
                    <option value="Thriller">Thriller</option>
                </select>
            </div>
        </div>

        <div class="section-title">
            <span id="sectionHeading">Movie Collection</span>
            <span id="pageBadge" class="badge">Page 1</span>
        </div>

        <div id="movieGrid" class="movie-grid"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <footer>
        <p>&copy; 2026 drsamangyi. All rights reserved.</p>
    </footer>

    <script>
        const moviesPerPage = 24;
        let allMovies = [];

        // 🚀 2. Local Caching with sessionStorage for instant speed
        async function initMovies() {
            try {
                const cachedMovies = sessionStorage.getItem('drsamangyi_movies');
                if (cachedMovies) {
                    allMovies = JSON.parse(cachedMovies);
                } else {
                    const response = await fetch('movies.json');
                    allMovies = await response.json();
                    sessionStorage.setItem('drsamangyi_movies', JSON.stringify(allMovies));
                }
                filterMovies();
            } catch (error) {
                console.error('Error loading movies:', error);
            }
        }

        // 🛡️ 3. XSS Sanitization for Security
        function sanitizeInput(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function filterMovies() {
            const rawQuery = document.getElementById('searchInput').value;
            const searchQuery = sanitizeInput(rawQuery.toLowerCase());
            const sortBy = document.getElementById('sortFilter').value;
            const category = document.getElementById('categoryFilter').value;

            let filtered = allMovies.filter(movie => 
                movie.title.toLowerCase().includes(searchQuery)
            );

            if (category !== 'all') {
                filtered = filtered.filter(movie => movie.genre === category);
            }

            if (sortBy === 'top_rated') {
                filtered.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
            } else if (sortBy === 'most_viewed') {
                filtered.sort((a, b) => b.views - a.views);
            }

            renderPage(filtered);
        }

        function renderPage(movies) {
            const urlParams = new URLSearchParams(window.location.search);
            let currentPage = parseInt(urlParams.get('page')) || 1;

            const grid = document.getElementById('movieGrid');
            const paginationDiv = document.getElementById('pagination');
            
            const startIndex = (currentPage - 1) * moviesPerPage;
            const endIndex = startIndex + moviesPerPage;
            const paginatedMovies = movies.slice(startIndex, endIndex);

            document.getElementById('pageBadge').innerText = `Page ${currentPage}`;

            grid.innerHTML = '';
            if (paginatedMovies.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #777;">No movies found.</p>';
                paginationDiv.innerHTML = '';
                return;
            }

            paginatedMovies.forEach(movie => {
                const card = document.createElement('a');
                const encodedId = btoa(movie.id);
                card.href = `watch.html?title=${encodeURIComponent(movie.title)}&v=${encodedId}`;
                card.className = 'movie-card';
                
                // ⚡ 1. Lazy Loading & Error Handling for Posters
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">⭐ ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const totalPages = Math.ceil(movies.length / moviesPerPage);
            paginationDiv.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('a');
                btn.href = `index.html?page=${i}`;
                btn.innerText = i;
                if (i === currentPage) {
                    btn.className = 'active';
                }
                paginationDiv.appendChild(btn);
            }
        }

        initMovies();
    </script>
</body>
</html>
