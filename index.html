<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Movie Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-rose-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-xl font-bold bg-gradient-to-r from-rose-500 to-purple-500 bg-clip-text text-transparent">
                🎬 MM Movie Collections
            </h1>
            <div class="w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="ဇာတ်ကားနာမည် ရှာရန်..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-rose-500 transition-colors">
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
            <!-- Dynamic Movies -->
        </div>

        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
            <!-- Pagination Buttons -->
        </div>
    </main>

    <script>
        let allMovies = [];
        let currentPage = 1;
        const itemsPerPage = 24;

        async function loadMovies() {
            try {
                const response = await fetch('movies.json');
                allMovies = await response.json();
                renderApp();
            } catch (error) {
                console.error('Error loading movies:', error);
            }
        }

        function renderApp() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const filteredMovies = allMovies.filter(movie => 
                movie.title.toLowerCase().includes(searchKeyword)
            );

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedMovies = filteredMovies.slice(startIndex, startIndex + itemsPerPage);

            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (paginatedMovies.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">ဇာတ်ကား မတွေ့ပါ။</p>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            paginatedMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-slate-700 transition-all flex flex-col group cursor-pointer";
                
                // Plaintext link ကို encodeURIComponent သုံးပြီး ပို့ပါမည်
                card.onclick = () => {
                    window.location.href = `watch.html?v=${encodeURIComponent(movie.video)}&t=${encodeURIComponent(movie.title)}`;
                };

                card.innerHTML = `
                    <div class="aspect-[2/3] overflow-hidden bg-slate-950 relative">
                        <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <h3 class="text-sm font-medium line-clamp-2 text-slate-200 group-hover:text-rose-400 transition-colors">${movie.title}</h3>
                        <span class="text-xs text-slate-500 mt-2">${new Date(movie.createdAt).toLocaleDateString()}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(filteredMovies.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btnActual = document.createElement('button');
                btnActual.innerText = i;
                btnActual.className = `px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                    currentPage === i 
                        ? 'bg-rose-600 text-white' 
                        : 'bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800'
                }`;
                btnActual.onclick = () => {
                    currentPage = i;
                    renderApp();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationContainer.appendChild(btnActual);
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            renderApp();
        });

        loadMovies();
    </script>
</body>
</html>
