    <script>
        const moviesPerPage = 24;
        let allMovies = [];

        function toggleFilters() {
            const drawer = document.getElementById('filterDrawer');
            const btn = document.getElementById('filterBtn');
            drawer.classList.toggle('show');
            btn.classList.toggle('active');
        }

        async function initMovies() {
            try {
                const cachedMovies = sessionStorage.getItem('drsamangyi_movies');
                if (cachedMovies) {
                    allMovies = JSON.parse(cachedMovies);
                } else {
                    const response = await fetch('movies.json');
                    allMovies = await response.json();
                    sessionStorage.setItem('drsamangyi_movies', JSON.stringify(allMovies));
                }
                filterMovies();
            } catch (error) {
                console.error('Error loading movies:', error);
            }
        }

        function sanitizeInput(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        //  Unicode-safe Base64 Encoder Helper (Original Unchanged)
        function b64EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function filterMovies() {
            const rawQuery = document.getElementById('searchInput').value;
            const searchQuery = sanitizeInput(rawQuery.toLowerCase());
            const sortBy = document.getElementById('sortFilter').value;
            const category = document.getElementById('categoryFilter').value;

            let filtered = allMovies.filter(movie => 
                movie.title.toLowerCase().includes(searchQuery)
            );

            if (category !== 'all') {
                filtered = filtered.filter(movie => movie.genre === category);
            }

            if (sortBy === 'oldest') {
                filtered.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
            } else {
                // Default: Latest (createdAt အပေါ်မူတည်ပြီး အသစ်ဆုံးများ ရှေ့ဆုံးသို့ ရောက်စေခြင်း)
                filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }

            renderPage(filtered);
        }

        function renderPage(movies) {
            const urlParams = new URLSearchParams(window.location.search);
            let currentPage = parseInt(urlParams.get('page')) || 1;

            const grid = document.getElementById('movieGrid');
            const paginationDiv = document.getElementById('pagination');
            
            const startIndex = (currentPage - 1) * moviesPerPage;
            const endIndex = startIndex + moviesPerPage;
            const paginatedMovies = movies.slice(startIndex, endIndex);

            document.getElementById('pageBadge').innerText = `Page ${currentPage}`;

            grid.innerHTML = '';
            if (paginatedMovies.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #777;">No movies found.</p>';
                paginationDiv.innerHTML = '';
                return;
            }

            paginatedMovies.forEach(movie => {
                const card = document.createElement('a');
                
                //  Base64 Security Layer (Original Unchanged)
                const encodedVideoUrl = b64EncodeUnicode(movie.video);
                card.href = `watch.html?title=${encodeURIComponent(movie.title)}&v=${encodeURIComponent(encodedVideoUrl)}`;
                
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.genre}</span>
                            <span> ${new Date(movie.createdAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const totalPages = Math.ceil(movies.length / moviesPerPage);
            paginationDiv.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('a');
                btn.href = `index.html?page=${i}`;
                btn.innerText = i;
                if (i === currentPage) {
                    btn.className = 'active';
                }
                paginationDiv.appendChild(btn);
            }
        }

        initMovies();
    </script>
