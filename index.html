    <script>
        /* =========================================
           MOVIE CONFIGURATION
        ========================================= */

        const moviesPerPage = 24;

        const FALLBACK_IMAGE =
            'https://via.placeholder.com/500x750?text=No+Poster';

        const CACHE_KEY = 'drsamangyi_movies';

        let allMovies = [];

        /* =========================================
           FILTER DRAWER
        ========================================= */

        function toggleFilters() {

            const drawer = document.getElementById('filterDrawer');
            const btn = document.getElementById('filterBtn');

            drawer.classList.toggle('show');
            btn.classList.toggle('active');

            btn.setAttribute(
                'aria-expanded',
                drawer.classList.contains('show')
            );
        }

        /* =========================================
           SAFE URL VALIDATION
        ========================================= */

        function getSafeUrl(value) {

            if (typeof value !== 'string' || !value.trim()) {
                return null;
            }

            try {

                const url = new URL(
                    value,
                    window.location.origin
                );

                if (
                    url.protocol === 'https:' ||
                    url.protocol === 'http:'
                ) {
                    return url.href;
                }

                return null;

            } catch (error) {

                return null;
            }
        }

        /* =========================================
           UNICODE SAFE BASE64 ENCODER
        ========================================= */

        function b64EncodeUnicode(str) {

            return btoa(
                encodeURIComponent(str).replace(
                    /%([0-9A-F]{2})/g,
                    function(match, p1) {

                        return String.fromCharCode(
                            parseInt(p1, 16)
                        );

                    }
                )
            );
        }

        /* =========================================
           LOAD MOVIES
        ========================================= */

        async function initMovies() {

            const grid = document.getElementById('movieGrid');

            try {

                const cachedMovies =
                    sessionStorage.getItem(CACHE_KEY);

                if (cachedMovies) {

                    const parsedMovies = JSON.parse(cachedMovies);

                    if (Array.isArray(parsedMovies)) {

                        allMovies = parsedMovies;

                    } else {

                        sessionStorage.removeItem(CACHE_KEY);
                    }
                }

                if (allMovies.length === 0) {

                    const response = await fetch('movies.json');

                    if (!response.ok) {

                        throw new Error(
                            `Failed to load movies: ${response.status}`
                        );
                    }

                    const data = await response.json();

                    if (!Array.isArray(data)) {

                        throw new Error(
                            'Invalid movies.json format'
                        );
                    }

                    allMovies = data;

                    sessionStorage.setItem(
                        CACHE_KEY,
                        JSON.stringify(allMovies)
                    );
                }

                /* Restore URL Search / Filter State */

                restoreFiltersFromURL();

                filterMovies(false);

            } catch (error) {

                console.error('Error loading movies:', error);

                grid.textContent =
                    'Unable to load movies. Please refresh the page.';
            }
        }

        /* =========================================
           RESTORE FILTERS FROM URL
        ========================================= */

        function restoreFiltersFromURL() {

            const params = new URLSearchParams(
                window.location.search
            );

            const searchInput =
                document.getElementById('searchInput');

            const sortFilter =
                document.getElementById('sortFilter');

            const categoryFilter =
                document.getElementById('categoryFilter');

            searchInput.value = params.get('q') || '';

            const sort = params.get('sort');

            if (
                sort === 'latest' ||
                sort === 'oldest' ||
                sort === 'most_viewed' ||
                sort === 'top_rated'
            ) {

                sortFilter.value = sort;
            }

            const category = params.get('category');

            if (
                category === 'all' ||
                category === 'mm-collections'
            ) {

                categoryFilter.value = category;
            }
        }

        /* =========================================
           UPDATE URL WITHOUT PAGE RELOAD
        ========================================= */

        function updateFilterURL(page = 1) {

            const params = new URLSearchParams();

            const searchQuery =
                document.getElementById('searchInput')
                    .value.trim();

            const sortBy =
                document.getElementById('sortFilter').value;

            const category =
                document.getElementById('categoryFilter').value;

            if (searchQuery) {

                params.set('q', searchQuery);
            }

            if (sortBy !== 'latest') {

                params.set('sort', sortBy);
            }

            if (category !== 'all') {

                params.set('category', category);
            }

            if (page > 1) {

                params.set('page', page);
            }

            const queryString = params.toString();

            const newURL = queryString
                ? `index.html?${queryString}`
                : 'index.html';

            window.history.replaceState(
                {},
                '',
                newURL
            );
        }

        /* =========================================
           FILTER AND SORT MOVIES
        ========================================= */

        function filterMovies(resetPage = false) {

            const rawQuery =
                document.getElementById('searchInput')
                    .value.trim().toLowerCase();

            const sortBy =
                document.getElementById('sortFilter').value;

            const category =
                document.getElementById('categoryFilter').value;

            const urlParams = new URLSearchParams(
                window.location.search
            );

            let currentPage = resetPage
                ? 1
                : parseInt(urlParams.get('page'), 10) || 1;

            /* Search */

            let filtered = allMovies.filter(movie => {

                const title = String(
                    movie.title || ''
                ).toLowerCase();

                return title.includes(rawQuery);
            });

            /* Category Filter */

            if (category !== 'all') {

                filtered = filtered.filter(movie => {

                    return movie.genre === category;

                });
            }

            /* Sorting */

            filtered.sort((a, b) => {

                const dateA = new Date(
                    a.createdAt || 0
                ).getTime() || 0;

                const dateB = new Date(
                    b.createdAt || 0
                ).getTime() || 0;

                const viewsA = Number(a.views) || 0;
                const viewsB = Number(b.views) || 0;

                const ratingA = parseFloat(a.rating) || 0;
                const ratingB = parseFloat(b.rating) || 0;

                switch (sortBy) {

                    case 'oldest':
                        return dateA - dateB;

                    case 'most_viewed':
                        return viewsB - viewsA;

                    case 'top_rated':
                        return ratingB - ratingA;

                    case 'latest':
                    default:
                        return dateB - dateA;
                }

            });

            updateFilterURL(currentPage);

            renderPage(filtered, currentPage);

        }

        /* =========================================
           RENDER MOVIES
        ========================================= */

        function renderPage(movies, currentPage = 1) {

            const totalPages = Math.ceil(

                movies.length / moviesPerPage

            );

            currentPage = Math.max(

                1,

                Math.min(

                    currentPage,

                    Math.max(totalPages, 1)

                )

            );

            const grid =

                document.getElementById('movieGrid');

            const paginationDiv =

                document.getElementById('pagination');

            const pageBadge =

                document.getElementById('pageBadge');

            const startIndex =

                (currentPage - 1) * moviesPerPage;

            const endIndex =

                startIndex + moviesPerPage;

            const paginatedMovies =

                movies.slice(startIndex, endIndex);

            pageBadge.textContent =

                `Page ${currentPage}`;

            grid.replaceChildren();

            /* No Movies Found */

            if (paginatedMovies.length === 0) {

                const emptyMessage =

                    document.createElement('p');

                emptyMessage.style.gridColumn = '1 / -1';

                emptyMessage.style.textAlign = 'center';

                emptyMessage.style.color = '#777';

                emptyMessage.textContent =

                    'No movies found.';

                grid.appendChild(emptyMessage);

                paginationDiv.replaceChildren();

                return;

            }

            /* Movie Cards */

            paginatedMovies.forEach(movie => {

                const title = String(

                    movie.title || 'Untitled Movie'

                );

                const videoURL = String(

                    movie.video || ''

                );

                const imageURL = getSafeUrl(

                    movie.img

                );

                const card =

                    document.createElement('a');

                /* Base64 Video URL */

                const encodedVideoURL =

                    b64EncodeUnicode(videoURL);

                card.href =

                    `watch.html?title=${encodeURIComponent(title)}&v=${encodeURIComponent(encodedVideoURL)}`;

                card.className = 'movie-card';

                /* Movie Poster */

                const poster =

                    document.createElement('img');

                poster.src =

                    imageURL || FALLBACK_IMAGE;

                poster.alt = title;

                poster.loading = 'lazy';

                poster.onerror = function() {

                    this.onerror = null;

                    this.src = FALLBACK_IMAGE;

                };

                /* Movie Information */

                const movieInfo =

                    document.createElement('div');

                movieInfo.className = 'movie-info';

                const movieTitle =

                    document.createElement('h3');

                movieTitle.textContent = title;

                const movieMeta =

                    document.createElement('div');

                movieMeta.className = 'movie-meta';

                const genre =

                    document.createElement('span');

                genre.textContent = String(

                    movie.genre || 'Uncategorized'

                );

                const date =

                    document.createElement('span');

                const createdAt = movie.createdAt

                    ? new Date(movie.createdAt)

                    : null;

                date.textContent =

                    createdAt &&

                    !isNaN(createdAt.getTime())

                        ? createdAt.toLocaleDateString()

                        : '';

                movieMeta.appendChild(genre);

                movieMeta.appendChild(date);

                movieInfo.appendChild(movieTitle);

                movieInfo.appendChild(movieMeta);

                card.appendChild(poster);

                card.appendChild(movieInfo);

                grid.appendChild(card);

            });

            /* Pagination */

            renderPagination(

                paginationDiv,

                currentPage,

                totalPages

            );

        }

        /* =========================================
           PAGINATION WITH FILTER PRESERVATION
        ========================================= */

        function renderPagination(

            container,

            currentPage,

            totalPages

        ) {

            container.replaceChildren();

            if (totalPages <= 1) {

                return;

            }

            for (let i = 1; i <= totalPages; i++) {

                const params = new URLSearchParams(

                    window.location.search

                );

                if (i > 1) {

                    params.set('page', i);

                } else {

                    params.delete('page');

                }

                const queryString = params.toString();

                const btn =

                    document.createElement('a');

                btn.href = queryString

                    ? `index.html?${queryString}`

                    : 'index.html';

                btn.textContent = i;

                if (i === currentPage) {

                    btn.className = 'active';

                    btn.setAttribute(

                        'aria-current',

                        'page'

                    );

                }

                container.appendChild(btn);

            }

        }

        /* =========================================
           INITIALIZE WEBSITE
        ========================================= */

        initMovies();

    </script>
