    <script>
        /* =========================================
           MOVIE CONFIGURATION
        ========================================= */

        const moviesPerPage = 24;

        const FALLBACK_IMAGE =
            'https://via.placeholder.com/500x750?text=No+Poster';

        const CACHE_KEY = 'drsamangyi_movies_v2';
        const CACHE_TTL = 10 * 60 * 1000;

        const VIEW_API =
            'https://drsamangyi-view-counter.channeltv4u.workers.dev';

        let allMovies = [];

        /* =========================================
           FILTER DRAWER
        ========================================= */

        function toggleFilters() {

            const drawer = document.getElementById('filterDrawer');
            const btn = document.getElementById('filterBtn');

            drawer.classList.toggle('show');
            btn.classList.toggle('active');

            btn.setAttribute(
                'aria-expanded',
                drawer.classList.contains('show')
            );
        }

        /* =========================================
           SAFE URL VALIDATION
        ========================================= */

        function getSafeUrl(value) {

            if (typeof value !== 'string' || !value.trim()) {
                return null;
            }

            try {

                const url = new URL(
                    value,
                    window.location.origin
                );

                if (
                    url.protocol === 'https:' ||
                    url.protocol === 'http:'
                ) {
                    return url.href;
                }

                return null;

            } catch (error) {

                return null;
            }
        }

        /* =========================================
           EXTRACT MOVIE ID FROM VIDEO URL
        ========================================= */

        function getMovieId(videoUrl) {

            if (
                typeof videoUrl !== 'string' ||
                !videoUrl.trim()
            ) {
                return null;
            }

            try {

                const url = new URL(videoUrl);

                if (
                    url.protocol !== 'https:' ||
                    url.hostname !== 'pub-18678a28a2634123aa1c63d0b4feca75.r2.dev'
                ) {
                    return null;
                }

                const filename = url.pathname.split('/').pop();

                let decodedFilename;

                try {
                    decodedFilename = decodeURIComponent(filename);
                } catch (error) {
                    decodedFilename = filename;
                }

                const match = decodedFilename.match(
                    /^(movie\d+)\.mp4$/i
                );

                return match ? match[1] : null;

            } catch (error) {

                return null;
            }
        }

        /* =========================================
           VIEW COUNTER - LOAD SHARED VIEWS
        ========================================= */

        function getCanonicalVideoUrl(rawUrl) {

            let url;

            try {
                url = new URL(rawUrl);
            } catch (error) {
                return null;
            }

            if (
                url.protocol !== 'https:' ||
                url.hostname !== 'pub-18678a28a2634123aa1c63d0b4feca75.r2.dev'
            ) {
                return null;
            }

            const encodedPath = url.pathname
                .split('/')
                .map(segment => {

                    let decodedSegment;

                    try {
                        decodedSegment = decodeURIComponent(segment);
                    } catch (error) {
                        decodedSegment = segment;
                    }

                    decodedSegment = decodedSegment.normalize('NFC');

                    return encodeURIComponent(decodedSegment);
                })
                .join('/');

            url.pathname = encodedPath;

            return url.href;
        }

        async function getMovieKey(videoUrl) {

            const canonicalUrl = getCanonicalVideoUrl(videoUrl);

            if (!canonicalUrl) {
                return null;
            }

            if (
                !window.crypto ||
                !window.crypto.subtle
            ) {
                throw new Error('SHA-256 is not available');
            }

            const data = new TextEncoder().encode(canonicalUrl);

            const hashBuffer = await window.crypto.subtle.digest(
                'SHA-256',
                data
            );

            return Array.from(new Uint8Array(hashBuffer))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
        }

        async function loadMovieViews() {

            try {

                const response = await fetch(
                    VIEW_API + '/views',
                    {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-store'
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        'View API HTTP error: ' + response.status
                    );
                }

                const result = await response.json();

                if (!result.success || !Array.isArray(result.views)) {
                    throw new Error('Invalid View API response');
                }

                const viewMap = new Map(
                    result.views.map(item => [
                        String(item.movie_key),
                        Number(item.views) || 0
                    ])
                );

                await Promise.all(
                    allMovies.map(async movie => {

                        const key = await getMovieKey(movie.video || '');

                        movie.views = key
                            ? (viewMap.get(key) || 0)
                            : 0;
                    })
                );

                console.log('Movie views loaded successfully');

            } catch (error) {

                console.error('Unable to load movie views:', error);

                allMovies.forEach(movie => {
                    movie.views = Number(movie.views) || 0;
                });
            }
        }

        /* =========================================
           LOAD MOVIES WITH CACHE EXPIRATION
        ========================================= */

        async function initMovies() {

            const grid = document.getElementById('movieGrid');

            try {

                const cachedMovies =
                    sessionStorage.getItem(CACHE_KEY);

                const cachedTime = Number(
                    sessionStorage.getItem(CACHE_KEY + '_time')
                );

                if (cachedMovies && cachedTime) {

                    try {

                        const parsedMovies = JSON.parse(cachedMovies);

                        const cacheIsValid =
                            Array.isArray(parsedMovies) &&
                            Date.now() - cachedTime < CACHE_TTL;

                        if (cacheIsValid) {

                            allMovies = parsedMovies;

                        } else {

                            sessionStorage.removeItem(CACHE_KEY);
                            sessionStorage.removeItem(CACHE_KEY + '_time');
                        }

                    } catch (error) {

                        sessionStorage.removeItem(CACHE_KEY);
                        sessionStorage.removeItem(CACHE_KEY + '_time');
                    }
                }

                if (allMovies.length === 0) {

                    const response = await fetch(
                        '/movies.json',
                        { cache: 'no-cache' }
                    );

                    if (!response.ok) {

                        throw new Error(
                            `Failed to load movies: ${response.status}`
                        );
                    }

                    const data = await response.json();

                    if (!Array.isArray(data)) {

                        throw new Error(
                            'Invalid movies.json format'
                        );
                    }

                    allMovies = data;

                    try {

                        sessionStorage.setItem(
                            CACHE_KEY,
                            JSON.stringify(allMovies)
                        );

                        sessionStorage.setItem(
                            CACHE_KEY + '_time',
                            String(Date.now())
                        );

                    } catch (storageError) {

                        console.warn(
                            'Session cache unavailable:',
                            storageError
                        );
                    }
                }

                await loadMovieViews();

                restoreFiltersFromURL();

                filterMovies(false);

            } catch (error) {

                console.error('Error loading movies:', error);

                grid.textContent =
                    'Unable to load movies. Please refresh the page.';
            }
        }

        /* =========================================
           RESTORE FILTERS FROM URL
        ========================================= */

        function restoreFiltersFromURL() {

            const params = new URLSearchParams(
                window.location.search
            );

            const searchInput =
                document.getElementById('searchInput');

            const sortFilter =
                document.getElementById('sortFilter');

            const categoryFilter =
                document.getElementById('categoryFilter');

            searchInput.value = params.get('q') || '';

            const sort = params.get('sort');

            if (
                sort === 'latest' ||
                sort === 'oldest' ||
                sort === 'most_viewed'
            ) {
                sortFilter.value = sort;
            }

            const category = params.get('category');

            if (
                category === 'all' ||
                category === 'mm-collections'
            ) {
                categoryFilter.value = category;
            }
        }

        /* =========================================
           UPDATE URL WITHOUT PAGE RELOAD
        ========================================= */

        function updateFilterURL(page = 1) {

            const params = new URLSearchParams();

            const searchQuery =
                document.getElementById('searchInput')
                    .value.trim();

            const sortBy =
                document.getElementById('sortFilter').value;

            const category =
                document.getElementById('categoryFilter').value;

            if (searchQuery) {
                params.set('q', searchQuery);
            }

            if (sortBy !== 'latest') {
                params.set('sort', sortBy);
            }

            if (category !== 'all') {
                params.set('category', category);
            }

            if (page > 1) {
                params.set('page', page);
            }

            const queryString = params.toString();

            const newURL = queryString
                ? `/?${queryString}`
                : '/';

            window.history.replaceState(
                {},
                '',
                newURL
            );
        }

        /* =========================================
           FILTER AND SORT MOVIES
        ========================================= */

        function filterMovies(resetPage = false) {

            const rawQuery =
                document.getElementById('searchInput')
                    .value.trim().toLowerCase();

            const sortBy =
                document.getElementById('sortFilter').value;

            const category =
                document.getElementById('categoryFilter').value;

            const urlParams = new URLSearchParams(
                window.location.search
            );

            let currentPage = resetPage
                ? 1
                : parseInt(urlParams.get('page'), 10) || 1;

            let filtered = allMovies.filter(movie => {

                const title = String(
                    movie.title || ''
                ).toLowerCase();

                return title.includes(rawQuery);
            });

            if (category !== 'all') {

                filtered = filtered.filter(movie => {
                    return movie.genre === category;
                });
            }

            filtered.sort((a, b) => {

                const dateA = new Date(
                    a.createdAt || 0
                ).getTime() || 0;

                const dateB = new Date(
                    b.createdAt || 0
                ).getTime() || 0;

                const viewsA = Number(a.views) || 0;
                const viewsB = Number(b.views) || 0;

                switch (sortBy) {

                    case 'oldest':
                        return dateA - dateB;

                    case 'most_viewed':
                        return viewsB - viewsA;

                    case 'latest':
                    default:
                        return dateB - dateA;
                }
            });

            const totalPages = Math.ceil(
                filtered.length / moviesPerPage
            );

            currentPage = Math.max(
                1,
                Math.min(currentPage, Math.max(totalPages, 1))
            );

            updateFilterURL(currentPage);

            renderPage(filtered, currentPage);
        }

        /* =========================================
           FORMAT VIEW COUNT
        ========================================= */

        function formatViews(value) {

            const views = Number(value) || 0;

            return new Intl.NumberFormat(
                'en-US',
                {
                    notation: 'compact',
                    maximumFractionDigits: 1
                }
            ).format(views);
        }

        /* =========================================
           FORMAT MOVIE DATE
        ========================================= */

        function formatDisplayDate(value) {

            const timestamp = Date.parse(value);

            if (!Number.isFinite(timestamp)) {
                return 'Movie';
            }

            return new Intl.DateTimeFormat(
                'en-GB',
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }
            ).format(timestamp);
        }

        /* =========================================
           RENDER MOVIES
        ========================================= */

        function renderPage(movies, currentPage = 1) {

            const totalPages = Math.ceil(
                movies.length / moviesPerPage
            );

            currentPage = Math.max(
                1,
                Math.min(
                    currentPage,
                    Math.max(totalPages, 1)
                )
            );

            const grid =
                document.getElementById('movieGrid');

            const paginationDiv =
                document.getElementById('pagination');

            const pageBadge =
                document.getElementById('pageBadge');

            const startIndex =
                (currentPage - 1) * moviesPerPage;

            const endIndex =
                startIndex + moviesPerPage;

            const paginatedMovies =
                movies.slice(startIndex, endIndex);

            pageBadge.textContent =
                `Page ${currentPage} · ${movies.length} Movies`;

            grid.replaceChildren();

            if (paginatedMovies.length === 0) {

                const emptyMessage =
                    document.createElement('p');

                emptyMessage.className = 'status-message';

                emptyMessage.textContent =
                    'No movies found.';

                grid.appendChild(emptyMessage);

                paginationDiv.replaceChildren();

                return;
            }

            paginatedMovies.forEach((movie, index) => {

                const title = String(
                    movie.title || 'Untitled Movie'
                );

                const videoURL = String(
                    movie.video || ''
                );

                const movieId = getMovieId(videoURL);

                const imageURL = getSafeUrl(movie.img);

                /*
                   Use the ID-based Watch URL.
                   Example: /watch?id=movie00049
                */

                if (!movieId) {

                    console.warn(
                        'Movie ID could not be extracted:',
                        title,
                        videoURL
                    );

                    return;
                }

                const card =
                    document.createElement('a');

                card.href =
                    `/watch?id=${encodeURIComponent(movieId)}`;

                card.className = 'movie-card';

                card.setAttribute(
                    'aria-label',
                    `Watch ${title}`
                );

                const poster =
                    document.createElement('img');

                poster.src =
                    imageURL || FALLBACK_IMAGE;

                poster.alt = title;

                poster.width = 500;
                poster.height = 750;

                poster.decoding = 'async';

                if (index === 0) {

                    poster.loading = 'eager';
                    poster.fetchPriority = 'high';

                } else {

                    poster.loading = 'lazy';
                }

                poster.onerror = function() {

                    this.onerror = null;
                    this.src = FALLBACK_IMAGE;
                };

                const movieInfo =
                    document.createElement('div');

                movieInfo.className = 'movie-info';

                const movieTitle =
                    document.createElement('h3');

                movieTitle.textContent = title;
                movieTitle.title = title;

                const movieMeta =
                    document.createElement('div');

                movieMeta.className = 'movie-meta';

                const date =
                    document.createElement('span');

                date.textContent =
                    movie.createdAt
                        ? formatDisplayDate(movie.createdAt)
                        : 'Myanmar Collection';

                const views =
                    document.createElement('span');

                views.className = 'rating';

                views.textContent =
                    `▶ ${formatViews(movie.views || 0)}`;

                views.title =
                    `${Number(movie.views) || 0} views`;

                movieMeta.appendChild(date);
                movieMeta.appendChild(views);

                movieInfo.appendChild(movieTitle);
                movieInfo.appendChild(movieMeta);

                card.appendChild(poster);
                card.appendChild(movieInfo);

                grid.appendChild(card);
            });

            renderPagination(
                paginationDiv,
                currentPage,
                totalPages
            );
        }

        /* =========================================
           PAGINATION
        ========================================= */

        function renderPagination(
            container,
            currentPage,
            totalPages
        ) {

            container.replaceChildren();

            if (totalPages <= 1) {
                return;
            }

            for (let i = 1; i <= totalPages; i++) {

                const params = new URLSearchParams(
                    window.location.search
                );

                if (i > 1) {
                    params.set('page', i);
                } else {
                    params.delete('page');
                }

                const queryString = params.toString();

                const btn =
                    document.createElement('a');

                btn.href = queryString
                    ? `/?${queryString}`
                    : '/';

                btn.textContent = i;

                btn.setAttribute(
                    'aria-label',
                    `Go to movie page ${i}`
                );

                if (i === currentPage) {

                    btn.className = 'active';

                    btn.setAttribute(
                        'aria-current',
                        'page'
                    );
                }

                container.appendChild(btn);
            }
        }

        /* =========================================
           INITIALIZE WEBSITE
        ========================================= */

        initMovies();

    </script>
