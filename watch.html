
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch Movie - drsamangyi</title>

    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#121212">

    <!-- Plyr CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            overflow-y: scroll;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: #e50914;
            border-radius: 5px;
        }

        header {
            background: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            white-space: nowrap;
        }

        nav a:hover,
        nav a.active {
            color: #e50914;
        }

        @media (max-width: 480px) {
            header {
                padding: 12px 15px;
            }

            .logo {
                font-size: 18px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 13px;
            }
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .movie-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #fff;
            border-left: 4px solid #e50914;
            padding-left: 12px;
        }

        .player-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        .player-box video {
            width: 100%;
            height: auto;
            display: block;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            background: #1f1f1f;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            border: 1px solid #333;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #1f1f1f;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #333;
        }

        /* =====================================
           PLYR RESPONSIVE CONTROL FIX
           DESKTOP + MOBILE
        ===================================== */

        .plyr--video {
            --plyr-range-track-height: 5px;
        }

        /* Progress Bar */
        .plyr--video .plyr__controls .plyr__progress {
            flex: 1 1 0% !important;
            min-width: 0 !important;
            width: auto !important;
        }

        /* Volume Container */
        .plyr--video .plyr__controls .plyr__volume {
            flex: 0 0 65px !important;
            width: 65px !important;
            min-width: 0 !important;
            max-width: 65px !important;
        }

        /* Volume Slider */
        .plyr--video .plyr__volume input[type="range"] {
            width: 100% !important;
            max-width: 65px !important;
        }

        /* Control Spacing */
        .plyr--video .plyr__controls {
            gap: 6px;
        }

        /* =====================================
           DESKTOP VIEW
        ===================================== */

        @media (min-width: 768px) {

            .plyr--video .plyr__controls .plyr__volume {
                flex-basis: 70px !important;
                max-width: 70px !important;
            }

            .plyr--video .plyr__volume input[type="range"] {
                max-width: 70px !important;
            }

        }

        /* =====================================
           MOBILE VIEW
        ===================================== */

        @media (max-width: 767px) {

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .movie-title {
                font-size: 1.4rem;
            }

            .plyr--video .plyr__controls {
                gap: 3px;
                padding: 8px !important;
            }

            .plyr--video .plyr__controls .plyr__volume {
                flex: 0 0 45px !important;
                width: 45px !important;
                max-width: 45px !important;
            }

            .plyr--video .plyr__volume input[type="range"] {
                max-width: 45px !important;
            }

            .plyr--video .plyr__controls .plyr__progress {
                flex: 1 1 0% !important;
                min-width: 30px !important;
            }

        }

        /* =====================================
           SMALL MOBILE VIEW
        ===================================== */

        @media (max-width: 360px) {

            .plyr--video .plyr__controls {
                gap: 2px;
                padding: 6px !important;
            }

            .plyr--video .plyr__controls .plyr__volume {
                flex-basis: 35px !important;
                width: 35px !important;
                max-width: 35px !important;
            }

            .plyr--video .plyr__volume input[type="range"] {
                max-width: 35px !important;
            }

        }

    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">drsamangyi</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">

        <h1 id="movieTitle" class="movie-title">
            Loading Movie...
        </h1>

        <div class="player-box">

            <video
                id="player"
                playsinline
                controls
                preload="metadata"
            >
                Your browser does not support HTML5 video.
            </video>

        </div>

        <a href="index.html" class="back-btn">
            &#8592; Back to Home
        </a>

    </div>

    <footer>
        <p>&copy; 2026 drsamangyi. All rights reserved.</p>
    </footer>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.min.js"></script>

    <script>

        // =========================================
        // CONFIGURATION
        // =========================================

        const R2_HOST =
            'pub-18678a28a2634123aa1c63d0b4feca75.r2.dev';


        // =========================================
        // GET URL PARAMETERS
        // =========================================

        const params = new URLSearchParams(
            window.location.search
        );

        const movieTitle = params.get('title');

        const encodedVideo = params.get('v');

        const titleElement =
            document.getElementById('movieTitle');

        const videoElement =
            document.getElementById('player');


        // =========================================
        // DISPLAY MOVIE TITLE
        // =========================================

        titleElement.textContent =
            movieTitle || 'drsamangyi Exclusive Movie';


        // =========================================
        // BASE64 UNICODE DECODER
        // =========================================

        function b64DecodeUnicode(str) {

            if (!str) {
                throw new Error('Video URL is missing');
            }

            // Support standard Base64 and Base64URL

            let normalized = str
                .replace(/ /g, '+')
                .replace(/-/g, '+')
                .replace(/_/g, '/');

            // Restore missing Base64 padding

            while (normalized.length % 4 !== 0) {
                normalized += '=';
            }

            const binary = atob(normalized);

            const bytes = Uint8Array.from(
                binary,
                char => char.charCodeAt(0)
            );

            return new TextDecoder('utf-8', {
                fatal: true
            }).decode(bytes);

        }


        // =========================================
        // CLOUDFLARE R2 URL ENCODER
        // =========================================

        function encodeR2VideoUrl(rawUrl) {

            let url;

            try {
                url = new URL(rawUrl);
            } catch (error) {
                throw new Error('Invalid video URL');
            }

            // HTTPS only

            if (url.protocol !== 'https:') {
                throw new Error('Invalid video protocol');
            }

            // Allow only our own R2 bucket domain

            if (url.hostname !== R2_HOST) {
                throw new Error('Untrusted video host');
            }

            if (url.username || url.password) {
                throw new Error('Invalid video URL credentials');
            }

            // Encode each path segment separately

            const encodedPath = url.pathname
                .split('/')
                .map(segment => {

                    let decodedSegment;

                    try {
                        decodedSegment =
                            decodeURIComponent(segment);
                    } catch (error) {
                        decodedSegment = segment;
                    }

                    decodedSegment =
                        decodedSegment.normalize('NFC');

                    return encodeURIComponent(decodedSegment);

                })
                .join('/');

            url.pathname = encodedPath;

            return url;

        }


        // =========================================
        // VIDEO ERROR HANDLING
        // =========================================

        videoElement.addEventListener('error', () => {

            const error = videoElement.error;

            console.error('Video Playback Error:', error);

            titleElement.textContent =
                'Video playback failed. Please try again.';

        });


        // =========================================
        // INITIALIZE PLAYER
        // =========================================

        async function initPlayer() {

            try {

                // Check video parameter

                if (!encodedVideo) {
                    throw new Error('Video URL is missing');
                }

                // Decode Base64 URL

                const decodedUrl =
                    b64DecodeUnicode(encodedVideo);

                // Validate and encode R2 URL

                const videoUrl =
                    encodeR2VideoUrl(decodedUrl);


                // =================================
                // SET VIDEO SOURCE
                // =================================

                videoElement.src = videoUrl.href;

                videoElement.load();


                // =================================
                // INITIALIZE PLYR
                // =================================

                if (typeof Plyr === 'undefined') {
                    throw new Error('Plyr library failed to load');
                }

                const player = new Plyr(videoElement, {

                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'settings',
                        'pip',
                        'fullscreen'
                    ]

                });


                // =================================
                // PLAYER EVENT HANDLING
                // =================================

                player.on('ready', () => {

                    console.log(
                        'Plyr Player Initialized Successfully'
                    );

                });


                // Video playback started

                player.on('playing', () => {

                    console.log('Movie Playback Started');

                });


                // Video playback ended

                player.on('ended', () => {

                    console.log('Movie Playback Completed');

                });

            } catch (error) {

                console.error('Player Initialization Error:', error);

                titleElement.textContent =
                    'Unable to load movie. Please try again.';

            }

        }


        // =========================================
        // START PLAYER
        // =========================================

        initPlayer();

    </script>

</body>
</html>
