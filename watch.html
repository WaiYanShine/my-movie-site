<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - CineStream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; overflow-y: scroll; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 5px; }

        /* Header Layout Fixes for Mobile & Desktop */
        header { 
            background: #1f1f1f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            border-bottom: 1px solid #333; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { 
            font-size: 20px; 
            font-weight: bold; 
            color: #e50914; 
            text-decoration: none; 
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: #fff; text-decoration: none; font-size: 14px; transition: 0.3s; white-space: nowrap; }
        nav a:hover, nav a.active { color: #e50914; }

        @media (max-width: 480px) {
            header { padding: 12px 15px; }
            .logo { font-size: 18px; }
            nav { gap: 10px; }
            nav a { font-size: 13px; }
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .movie-title { font-size: 1.8rem; margin-bottom: 20px; color: #fff; border-left: 4px solid #e50914; padding-left: 12px; }

        /* Responsive Video Player Box */
        .player-box { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); 
            border: 1px solid #333;
        }
        .player-box iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        .back-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            margin-top: 25px; 
            background: #1f1f1f; 
            color: #fff; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 5px; 
            transition: 0.3s; 
            border: 1px solid #333;
            font-weight: 600;
        }
        .back-btn:hover { background: #e50914; border-color: #e50914; }

        footer { text-align: center; padding: 25px; background: #1f1f1f; color: #777; margin-top: 50px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 CineStream</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1 id="movieTitle" class="movie-title">Loading Movie...</h1>
        
        <div class="player-box">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <a href="index.html" class="back-btn">&#8592; Back to Home</a>
    </div>

    <footer>
        <p>&copy; 2026 CineStream. All rights reserved.</p>
    </footer>

    <script>
        // URL parameters တွေကို ဖတ်ယူခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('title');
        const encodedId = urlParams.get('v'); // Base64 encoded ID ကို ဖမ်းယူရန်

        // ဇာတ်ကားနာမည် သတ်မှတ်ပေးခြင်း
        if (movieTitle) {
            document.getElementById('movieTitle').innerText = decodeURIComponent(movieTitle);
        } else {
            document.getElementById('movieTitle').innerText = "CineStream Exclusive Movie";
        }

        // 🛡️ Security Layer: Base64 decode လုပ်ပြီး ဇာတ်ကားလင့်ခ်ဖော်ပြခြင်း (F12 ကာကွယ်ရန်)
        if (encodedId) {
            try {
                const decodedId = atob(encodedId); // Base64 decode ပြန်လုပ်သည်
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${decodedId}?autoplay=1`;
            } catch (e) {
                console.error("Invalid video encoding:", e);
                // အကယ်၍ error ဖြစ်သွားပါက default ဗီဒီယိုသို့ ပြောင်းပေးမည်
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
            }
        } else {
            // ID မပါလာပါက default ဗီဒီယိုပြရန်
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
        }
    </script>

</body>
</html>
