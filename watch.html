        /* =====================================

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.min.js"></script>

    <script>

        // =========================================
        // CONFIGURATION
        // =========================================

        const R2_HOST =
            'pub-18678a28a2634123aa1c63d0b4feca75.r2.dev';

        const VIEW_API =
            'https://drsamangyi-view-counter.channeltv4u.workers.dev';


        // =========================================
        // GET URL PARAMETERS
        // =========================================

        const params = new URLSearchParams(
            window.location.search
        );

        const movieTitle = params.get('title');
        const encodedVideo = params.get('v');

        const titleElement =
            document.getElementById('movieTitle');

        const videoElement =
            document.getElementById('player');


        // =========================================
        // DISPLAY MOVIE TITLE
        // =========================================

        titleElement.textContent =
            movieTitle || 'drsamangyi Exclusive Movie';


        // =========================================
        // BASE64 UNICODE DECODER
        // =========================================

        function b64DecodeUnicode(str) {

            if (!str) {
                throw new Error('Video URL is missing');
            }

            let normalized = str
                .replace(/ /g, '+')
                .replace(/-/g, '+')
                .replace(/_/g, '/');

            while (normalized.length % 4 !== 0) {
                normalized += '=';
            }

            const binary = atob(normalized);

            const bytes = Uint8Array.from(
                binary,
                char => char.charCodeAt(0)
            );

            return new TextDecoder('utf-8', {
                fatal: true
            }).decode(bytes);
        }


        // =========================================
        // CLOUDFLARE R2 URL ENCODER
        // =========================================

        function encodeR2VideoUrl(rawUrl) {

            let url;

            try {
                url = new URL(rawUrl);
            } catch (error) {
                throw new Error('Invalid video URL');
            }

            if (url.protocol !== 'https:') {
                throw new Error('Invalid video protocol');
            }

            if (url.hostname !== R2_HOST) {
                throw new Error('Untrusted video host');
            }

            if (url.username || url.password) {
                throw new Error('Invalid video URL credentials');
            }

            const encodedPath = url.pathname
                .split('/')
                .map(segment => {

                    let decodedSegment;

                    try {
                        decodedSegment =
                            decodeURIComponent(segment);
                    } catch (error) {
                        decodedSegment = segment;
                    }

                    decodedSegment =
                        decodedSegment.normalize('NFC');

                    return encodeURIComponent(decodedSegment);

                })
                .join('/');

            url.pathname = encodedPath;

            return url;
        }


        // =========================================
        // VIEW COUNTER CONFIGURATION
        // =========================================

        const REQUIRED_VIEW_SECONDS = 30;

        let movieKey = null;
        let visitorId = null;

        let watchedMilliseconds = 0;
        let lastTick = 0;

        let isTracking = false;
        let viewSubmitted = false;
        let viewRequestInProgress = false;


        // =========================================
        // GENERATE STABLE MOVIE KEY
        // SHA-256 ONLY
        // =========================================

        async function generateMovieKey(videoUrl) {

            if (
                !window.crypto ||
                !window.crypto.subtle
            ) {
                throw new Error(
                    'SHA-256 is not available'
                );
            }

            const data = new TextEncoder().encode(
                videoUrl
            );

            const hashBuffer = await window.crypto.subtle.digest(
                'SHA-256',
                data
            );

            return Array.from(
                new Uint8Array(hashBuffer)
            )
                .map(byte =>
                    byte.toString(16).padStart(2, '0')
                )
                .join('');
        }


        // =========================================
        // GET OR CREATE VISITOR ID
        // =========================================

        function getVisitorId() {

            const storageKey = 'drsamangyi_visitor_id';

            try {

                let id = localStorage.getItem(storageKey);

                if (!id) {

                    id = (
                        window.crypto &&
                        typeof window.crypto.randomUUID === 'function'
                    )
                        ? window.crypto.randomUUID()
                        : (
                            Date.now().toString(36) +
                            Math.random().toString(36).slice(2)
                        );

                    localStorage.setItem(storageKey, id);
                }

                return id;

            } catch (error) {

                console.warn(
                    'Visitor ID storage unavailable:',
                    error
                );

                return (
                    Date.now().toString(36) +
                    Math.random().toString(36).slice(2)
                );
            }
        }


        // =========================================
        // SEND VIEW TO CLOUDFLARE WORKER
        // =========================================

        async function submitMovieView() {

            if (
                viewSubmitted ||
                viewRequestInProgress ||
                !movieKey ||
                !visitorId
            ) {
                return;
            }

            viewRequestInProgress = true;

            try {

                const response = await fetch(
                    VIEW_API + '/view',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            movieKey: movieKey,
                            visitorId: visitorId
                        }),

                        mode: 'cors',
                        credentials: 'omit'
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        'View API HTTP error: ' + response.status
                    );
                }

                const result = await response.json();

                if (result.success) {

                    viewSubmitted = true;

                    console.log(
                        'Movie View Recorded:',
                        result
                    );

                } else {

                    console.warn(
                        'View Counter Error:',
                        result.error
                    );
                }

            } catch (error) {

                console.error(
                    'Unable to submit movie view:',
                    error
                );

            } finally {

                viewRequestInProgress = false;
            }
        }


        // =========================================
        // STOP VIEW TIMER
        // =========================================

        function stopViewTracking() {

            isTracking = false;
            lastTick = 0;
        }


        // =========================================
        // START VIEW TIMER
        // =========================================

        function startViewTracking() {

            if (
                viewSubmitted ||
                !movieKey ||
                !visitorId ||
                videoElement.paused ||
                videoElement.ended ||
                document.hidden
            ) {
                return;
            }

            isTracking = true;
            lastTick = performance.now();

            console.log('View Timer Started');
        }


        // =========================================
        // VIEW TIMER
        // COUNT ACTUAL PLAYBACK TIME ONLY
        // =========================================

        setInterval(() => {

            if (!isTracking || viewSubmitted) {
                lastTick = 0;
                return;
            }

            const now = performance.now();

            if (
                videoElement.paused ||
                videoElement.ended ||
                videoElement.seeking ||
                document.hidden ||
                videoElement.readyState < 3
            ) {
                lastTick = 0;
                return;
            }

            if (lastTick === 0) {
                lastTick = now;
                return;
            }

            const elapsed = now - lastTick;

            lastTick = now;

            // Ignore unusually large timer gaps

            if (elapsed > 1500 || elapsed < 0) {
                return;
            }

            watchedMilliseconds += elapsed;

            console.log(
                'Watched:',
                Math.floor(watchedMilliseconds / 1000),
                'seconds'
            );

            // Submit after 30 seconds

            if (
                watchedMilliseconds >=
                REQUIRED_VIEW_SECONDS * 1000
            ) {
                stopViewTracking();
                submitMovieView();
            }

        }, 250);


        // =========================================
        // VIDEO PLAYBACK EVENTS
        // =========================================

        videoElement.addEventListener(
            'playing',
            startViewTracking
        );

        videoElement.addEventListener(
            'pause',
            stopViewTracking
        );

        videoElement.addEventListener(
            'waiting',
            stopViewTracking
        );

        videoElement.addEventListener(
            'stalled',
            stopViewTracking
        );

        videoElement.addEventListener(
            'ended',
            stopViewTracking
        );

        videoElement.addEventListener(
            'seeking',
            stopViewTracking
        );

        videoElement.addEventListener(
            'seeked',
            () => {

                if (
                    !videoElement.paused &&
                    videoElement.readyState >= 3
                ) {
                    startViewTracking();
                }
            }
        );


        // =========================================
        // TAB VISIBILITY HANDLING
        // =========================================

        document.addEventListener(
            'visibilitychange',
            () => {

                if (document.hidden) {

                    stopViewTracking();

                } else if (
                    !videoElement.paused &&
                    !videoElement.ended &&
                    videoElement.readyState >= 3
                ) {

                    startViewTracking();
                }
            }
        );


        // =========================================
        // VIDEO ERROR HANDLING
        // =========================================

        videoElement.addEventListener('error', () => {

            const error = videoElement.error;

            console.error('Video Playback Error:', error);

            titleElement.textContent =
                'Video playback failed. Please try again.';

            stopViewTracking();
        });


        // =========================================
        // INITIALIZE PLAYER
        // VIDEO MUST NOT WAIT FOR VIEW COUNTER
        // =========================================

        async function initPlayer() {

            try {

                if (!encodedVideo) {
                    throw new Error('Video URL is missing');
                }

                // Decode video URL

                const decodedUrl =
                    b64DecodeUnicode(encodedVideo);

                // Validate R2 URL

                const videoUrl =
                    encodeR2VideoUrl(decodedUrl);


                // =================================
                // SET VIDEO SOURCE FIRST
                // =================================

                videoElement.src = videoUrl.href;

                videoElement.load();


                // =================================
                // INITIALIZE PLYR
                // =================================

                if (typeof Plyr === 'undefined') {
                    throw new Error('Plyr library failed to load');
                }

                const player = new Plyr(videoElement, {

                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'settings',
                        'pip',
                        'fullscreen'
                    ]

                });


                // =================================
                // PLAYER EVENT HANDLING
                // =================================

                player.on('ready', () => {

                    console.log(
                        'Plyr Player Initialized Successfully'
                    );

                });

                player.on('playing', () => {

                    console.log('Movie Playback Started');

                });

                player.on('ended', () => {

                    console.log('Movie Playback Completed');

                });


                // =================================
                // INITIALIZE VIEW COUNTER SEPARATELY
                // =================================

                generateMovieKey(videoUrl.href)
                    .then(key => {

                        movieKey = key;

                        visitorId = getVisitorId();

                        console.log(
                            'View Counter Initialized'
                        );

                        // If video is already playing,
                        // start tracking after initialization.

                        if (
                            !videoElement.paused &&
                            !videoElement.ended &&
                            !document.hidden &&
                            videoElement.readyState >= 3
                        ) {
                            startViewTracking();
                        }

                    })
                    .catch(error => {

                        console.warn(
                            'View Counter Initialization Failed:',
                            error
                        );

                    });

            } catch (error) {

                console.error(
                    'Player Initialization Error:',
                    error
                );

                titleElement.textContent =
                    'Unable to load movie. Please try again.';

            }
        }


        // =========================================
        // START PLAYER
        // =========================================

        initPlayer();

    </script>
