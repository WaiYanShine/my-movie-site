<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - CineStream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; }
        
        header { background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid #333; }
        .logo { font-size: 22px; font-weight: bold; color: #e50914; text-decoration: none; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 15px; }
        nav a:hover { color: #e50914; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .movie-title { font-size: 2rem; margin-bottom: 20px; color: #fff; }

        .player-box { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .back-btn { display: inline-block; margin-top: 25px; background: #333; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: #e50914; }

        footer { text-align: center; padding: 25px; background: #1f1f1f; color: #777; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🎬 CineStream</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1 id="movieTitle" class="movie-title">Loading Movie...</h1>
        
        <div class="player-box">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <a href="index.html" class="back-btn">&#8592; Back to Home</a>
    </div>

    <footer>
        <p>&copy; 2026 CineStream. All rights reserved.</p>
    </footer>

    <script>
        // URL ထဲက ဇာတ်ကားနာမည်နဲ့ YouTube ID ကို ဖတ်ယူပြီး Page ပေါ် တင်ပေးခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('title');
        const movieId = urlParams.get('id');

        if (movieTitle) {
            document.getElementById('movieTitle').innerText = decodeURIComponent(movieTitle);
        } else {
            document.getElementById('movieTitle').innerText = "Cyber City (Default)";
        }

        if (movieId) {
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${movieId}?autoplay=1`;
            } else {
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
        }
    </script>

</body>
</html>
