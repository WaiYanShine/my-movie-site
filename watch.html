    <script>
        // =========================================

        // =========================================

        let safeTitle = 'Watch Movie';

        // =========================================
        // META TAG HELPERS
        // =========================================

        function setMeta(name, content, attribute = 'name') {

            let element = document.querySelector(
                `meta[${attribute}="${name}"]`
            );

            if (!element) {
                element = document.createElement('meta');
                element.setAttribute(attribute, name);
                document.head.appendChild(element);
            }

            element.setAttribute('content', content);
        }


        // =========================================
        // ROBOTS
        // =========================================

        function setIndexable(indexable) {

            const robots = indexable
                ? 'index, follow, max-image-preview:large, max-video-preview:-1, max-snippet:-1'
                : 'noindex, follow';

            setMeta('robots', robots);
        }


        // Set indexing immediately for valid movie ID URLs.
        // Invalid IDs and legacy URLs remain noindex.
        const isValidMovieId =
            /^movie\d{5}$/i.test(requestedMovieId || '');

        setIndexable(isValidMovieId);


        // =========================================
        // CANONICAL URL
        // =========================================

        function setCanonical(url) {

            let canonical = document.querySelector(
                'link[rel="canonical"]'
            );

            if (!canonical) {
                canonical = document.createElement('link');
                canonical.rel = 'canonical';
                document.head.appendChild(canonical);
            }

            canonical.href = url;
        }


        // =========================================
        // DYNAMIC MOVIE SEO
        // =========================================

        function setMovieSEO(movie, movieId, videoUrl, imageUrl) {

            const canonicalUrl =
                `${SITE_URL}/watch?id=${encodeURIComponent(movieId)}`;

            const description =
                typeof movie.description === 'string' &&
                movie.description.trim()
                    ? movie.description.trim().slice(0, 300)
                    : `${movie.title} ကို drsamangyi တွင် ကြည့်ရှုနိုင်ပါသည်။`;

            const pageTitle =
                `${movie.title} | drsamangyi`;

            document.title = pageTitle;

            setMeta('description', description);

            setMeta('og:title', pageTitle, 'property');
            setMeta('og:description', description, 'property');
            setMeta('og:url', canonicalUrl, 'property');
            setMeta('og:type', 'video.other', 'property');
            setMeta('og:site_name', 'drsamangyi', 'property');

            setMeta('og:video', videoUrl, 'property');
            setMeta('og:video:secure_url', videoUrl, 'property');
            setMeta('og:video:type', 'video/mp4', 'property');

            setMeta('twitter:card', 'summary_large_image');
            setMeta('twitter:title', pageTitle);
            setMeta('twitter:description', description);

            if (imageUrl) {
                setMeta('og:image', imageUrl, 'property');
                setMeta('og:image:secure_url', imageUrl, 'property');
                setMeta('twitter:image', imageUrl);
            }

            setCanonical(canonicalUrl);

            setIndexable(true);
        }


        // =========================================
        // BASE64 UNICODE DECODER
        // LEGACY URL SUPPORT
        // =========================================

        function b64DecodeUnicode(str) {

            if (!str) {
                throw new Error('Video URL is missing');
            }

            let normalized = str
                .replace(/ /g, '+')
                .replace(/-/g, '+')
                .replace(/_/g, '/');

            while (normalized.length % 4 !== 0) {
                normalized += '=';
            }

            const binary = atob(normalized);

            const bytes = Uint8Array.from(
                binary,
                char => char.charCodeAt(0)
            );

            return new TextDecoder('utf-8', {
                fatal: true
            }).decode(bytes);
        }


        // =========================================
        // CLOUDFLARE R2 URL VALIDATOR
        // =========================================

        function encodeR2VideoUrl(rawUrl) {

            let url;

            try {
                url = new URL(rawUrl);
            } catch (error) {
                throw new Error('Invalid R2 URL');
            }

            if (url.protocol !== 'https:') {
                throw new Error('Invalid URL protocol');
            }

            if (url.hostname !== R2_HOST) {
                throw new Error('Untrusted R2 host');
            }

            if (url.username || url.password) {
                throw new Error('Invalid URL credentials');
            }

            if (url.port || url.search || url.hash) {
                throw new Error('Invalid URL format');
            }

            const encodedPath = url.pathname
                .split('/')
                .map(segment => {

                    let decodedSegment;

                    try {
                        decodedSegment =
                            decodeURIComponent(segment);
                    } catch (error) {
                        throw new Error('Invalid URL encoding');
                    }

                    decodedSegment =
                        decodedSegment.normalize('NFC');

                    return encodeURIComponent(decodedSegment);

                })
                .join('/');

            url.pathname = encodedPath;

            return url;
        }


        // =========================================
        // EXTRACT MOVIE ID FROM VIDEO FILENAME
        // =========================================

        function extractMovieId(videoUrl) {

            let filename;

            try {
                filename = decodeURIComponent(
                    videoUrl.pathname.split('/').pop() || ''
                );
            } catch (error) {
                return null;
            }

            const match = filename.match(
                /^(movie\d{5})\.mp4$/i
            );

            return match
                ? match[1].toLowerCase()
                : null;
        }


        // =========================================
        // LOAD MOVIES JSON
        // =========================================

        async function loadMoviesCatalog() {

            const response = await fetch(MOVIES_JSON, {
                method: 'GET',
                cache: 'no-cache',
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(
                    'Unable to load movies.json: ' +
                    response.status
                );
            }

            const movies = await response.json();

            if (!Array.isArray(movies)) {
                throw new Error('Invalid movies.json format');
            }

            return movies;
        }


        // =========================================
        // VALIDATE MOVIE OBJECT
        // =========================================

        function validateMovie(movie) {

            if (!movie || typeof movie !== 'object') {
                throw new Error('Invalid movie data');
            }

            if (
                typeof movie.title !== 'string' ||
                !movie.title.trim()
            ) {
                throw new Error('Invalid movie title');
            }

            if (typeof movie.video !== 'string') {
                throw new Error('Invalid movie video URL');
            }

            const videoUrl =
                encodeR2VideoUrl(movie.video);

            const movieId =
                extractMovieId(videoUrl);

            if (!movieId) {
                throw new Error('Invalid movie filename');
            }

            let imageUrl = null;

            if (
                typeof movie.img === 'string' &&
                movie.img.trim()
            ) {
                try {
                    imageUrl =
                        encodeR2VideoUrl(movie.img).href;
                } catch (error) {
                    console.warn(
                        'Invalid movie thumbnail:',
                        error
                    );
                }
            }

            return {
                movie: movie,
                movieId: movieId,
                title: movie.title.trim().slice(0, 200),
                videoUrl: videoUrl.href,
                imageUrl: imageUrl
            };
        }


        // =========================================
        // NORMALIZE LEGACY URL
        // =========================================

        function normalizeLegacyMovieUrl(movieId) {

            const canonicalPath =
                `/watch?id=${encodeURIComponent(movieId)}`;

            const currentPath =
                window.location.pathname +
                window.location.search;

            if (currentPath !== canonicalPath) {

                window.history.replaceState(
                    null,
                    '',
                    canonicalPath
                );

                console.log(
                    'Legacy URL normalized:',
                    canonicalPath
                );
            }
        }


        // =========================================
        // LOAD MOVIE DATA
        // NEW ID URL + LEGACY URL SUPPORT
        // =========================================

        async function loadMovieData() {

            const movies = await loadMoviesCatalog();


            // -------------------------------------
            // NEW URL FORMAT:
            // /watch?id=movie00049
            // -------------------------------------

            if (requestedMovieId !== null) {

                if (!/^movie\d{5}$/i.test(requestedMovieId)) {
                    throw new Error('Invalid movie ID');
                }

                const targetId =
                    requestedMovieId.toLowerCase();

                const movie = movies.find(item => {

                    if (
                        !item ||
                        typeof item.video !== 'string'
                    ) {
                        return false;
                    }

                    try {
                        const videoUrl =
                            encodeR2VideoUrl(item.video);

                        return extractMovieId(videoUrl) === targetId;

                    } catch (error) {
                        return false;
                    }
                });

                if (!movie) {
                    throw new Error('Movie not found');
                }

                return validateMovie(movie);
            }


            // -------------------------------------
            // LEGACY URL FORMAT:
            // ?title=...&v=...
            // -------------------------------------

            if (!encodedVideo) {
                throw new Error('Video URL is missing');
            }

            const decodedUrl =
                b64DecodeUnicode(encodedVideo);

            const validatedUrl =
                encodeR2VideoUrl(decodedUrl);

            const matchingMovie = movies.find(item => {

                if (
                    !item ||
                    typeof item.video !== 'string'
                ) {
                    return false;
                }

                try {
                    return encodeR2VideoUrl(
                        item.video
                    ).href === validatedUrl.href;

                } catch (error) {
                    return false;
                }
            });


            // -------------------------------------
            // MATCH FOUND:
            // NORMALIZE TO NEW ID URL
            // -------------------------------------

            if (matchingMovie) {

                const validatedMovie =
                    validateMovie(matchingMovie);

                normalizeLegacyMovieUrl(
                    validatedMovie.movieId
                );

                return validatedMovie;
            }


            // -------------------------------------
            // NO CATALOG MATCH:
            // KEEP LEGACY VIDEO NON-INDEXABLE
            // -------------------------------------

            return {
                movie: null,
                movieId: null,

                title:
                    movieTitleParam && movieTitleParam.trim()
                        ? movieTitleParam.trim().slice(0, 200)
                        : 'Watch Movie',

                videoUrl: validatedUrl.href,
                imageUrl: null
            };
        }


        // =========================================
        // VALIDATE UPLOAD DATE
        // =========================================

        function getValidUploadDate(movie) {

            if (!movie || typeof movie !== 'object') {
                return null;
            }

            const possibleDates = [
                movie.uploadDate,
                movie.createdAt,
                movie.datePublished,
                movie.date
            ];

            for (const value of possibleDates) {

                if (
                    typeof value !== 'string' ||
                    !value.trim()
                ) {
                    continue;
                }

                const timestamp = Date.parse(value);

                if (Number.isFinite(timestamp)) {
                    return new Date(timestamp).toISOString();
                }
            }

            return null;
        }


        // =========================================
        // VIDEOOBJECT STRUCTURED DATA
        // =========================================

        function addVideoStructuredData(
            movie,
            movieId,
            videoUrl,
            imageUrl
        ) {

            const existing = document.getElementById(
                'movieVideoStructuredData'
            );

            if (existing) {
                existing.remove();
            }

            if (!imageUrl) {
                console.warn(
                    'VideoObject not created: thumbnail is missing.'
                );
                return;
            }

            const canonicalUrl =
                `${SITE_URL}/watch?id=${encodeURIComponent(movieId)}`;

            const description =
                typeof movie.description === 'string' &&
                movie.description.trim()
                    ? movie.description.trim().slice(0, 300)
                    : `${movie.title} ကို drsamangyi တွင် ကြည့်ရှုနိုင်ပါသည်။`;

            const videoObject = {
                '@context': 'https://schema.org',
                '@type': 'VideoObject',

                name: movie.title,

                description: description,

                thumbnailUrl: [
                    imageUrl
                ],

                contentUrl: videoUrl,

                embedUrl: canonicalUrl,

                url: canonicalUrl,

                inLanguage: 'my'
            };

            const uploadDate =
                getValidUploadDate(movie);

            if (uploadDate) {
                videoObject.uploadDate = uploadDate;
            }

            if (
                typeof movie.duration === 'string' &&
                /^PT(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?$/i.test(
                    movie.duration
                )
            ) {
                videoObject.duration = movie.duration;
            }

            const script =
                document.createElement('script');

            script.id = 'movieVideoStructuredData';

            script.type = 'application/ld+json';

            script.textContent =
                JSON.stringify(videoObject);

            document.head.appendChild(script);

            console.log(
                'VideoObject Structured Data Added'
            );
        }


        // =========================================
        // VIEW COUNTER CONFIGURATION
        // =========================================

        const REQUIRED_VIEW_SECONDS = 30;

        let movieKey = null;
        let visitorId = null;

        let watchedMilliseconds = 0;
        let lastTick = 0;

        let isTracking = false;
        let viewSubmitted = false;
        let viewRequestInProgress = false;


        // =========================================
        // GENERATE STABLE MOVIE KEY
        // SHA-256 ONLY
        // =========================================

        async function generateMovieKey(videoUrl) {

            if (
                !window.crypto ||
                !window.crypto.subtle
            ) {
                throw new Error(
                    'SHA-256 is not available'
                );
            }

            const data = new TextEncoder().encode(
                videoUrl
            );

            const hashBuffer = await window.crypto.subtle.digest(
                'SHA-256',
                data
            );

            return Array.from(
                new Uint8Array(hashBuffer)
            )
                .map(byte =>
                    byte.toString(16).padStart(2, '0')
                )
                .join('');
        }


        // =========================================
        // GET OR CREATE VISITOR ID
        // =========================================

        function getVisitorId() {

            const storageKey = 'drsamangyi_visitor_id';

            try {

                let id = localStorage.getItem(storageKey);

                if (!id) {

                    id = (
                        window.crypto &&
                        typeof window.crypto.randomUUID === 'function'
                    )
                        ? window.crypto.randomUUID()
                        : (
                            Date.now().toString(36) +
                            Math.random().toString(36).slice(2)
                        );

                    localStorage.setItem(storageKey, id);
                }

                return id;

            } catch (error) {

                console.warn(
                    'Visitor ID storage unavailable:',
                    error
                );

                return (
                    Date.now().toString(36) +
                    Math.random().toString(36).slice(2)
                );
            }
        }


        // =========================================
        // SEND VIEW TO CLOUDFLARE WORKER
        // =========================================

        async function submitMovieView() {

            if (
                viewSubmitted ||
                viewRequestInProgress ||
                !movieKey ||
                !visitorId
            ) {
                return;
            }

            viewRequestInProgress = true;

            try {

                const response = await fetch(
                    VIEW_API + '/view',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            movieKey: movieKey,
                            visitorId: visitorId
                        }),

                        mode: 'cors',
                        credentials: 'omit'
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        'View API HTTP error: ' + response.status
                    );
                }

                const result = await response.json();

                if (result.success) {

                    viewSubmitted = true;

                    console.log(
                        'Movie View Recorded:',
                        result
                    );

                } else {

                    console.warn(
                        'View Counter Error:',
                        result.error
                    );
                }

            } catch (error) {

                console.error(
                    'Unable to submit movie view:',
                    error
                );

            } finally {

                viewRequestInProgress = false;
            }
        }


        // =========================================
        // STOP VIEW TIMER
        // =========================================

        function stopViewTracking() {
            isTracking = false;
            lastTick = 0;
        }


        // =========================================
        // START VIEW TIMER
        // =========================================

        function startViewTracking() {

            if (
                viewSubmitted ||
                !movieKey ||
                !visitorId ||
                videoElement.paused ||
                videoElement.ended ||
                document.hidden
            ) {
                return;
            }

            isTracking = true;
            lastTick = performance.now();

            console.log('View Timer Started');
        }


        // =========================================
        // VIEW TIMER
        // COUNT ACTUAL PLAYBACK TIME ONLY
        // =========================================

        setInterval(() => {

            if (!isTracking || viewSubmitted) {
                lastTick = 0;
                return;
            }

            const now = performance.now();

            if (
                videoElement.paused ||
                videoElement.ended ||
                videoElement.seeking ||
                document.hidden ||
                videoElement.readyState < 3
            ) {
                lastTick = 0;
                return;
            }

            if (lastTick === 0) {
                lastTick = now;
                return;
            }

            const elapsed = now - lastTick;

            lastTick = now;

            if (elapsed > 1500 || elapsed < 0) {
                return;
            }

            watchedMilliseconds += elapsed;

            if (
                watchedMilliseconds >=
                REQUIRED_VIEW_SECONDS * 1000
            ) {
                stopViewTracking();
                submitMovieView();
            }

        }, 250);


        // =========================================
        // VIDEO PLAYBACK EVENTS
        // =========================================

        videoElement.addEventListener(
            'playing',
            startViewTracking
        );

        videoElement.addEventListener(
            'pause',
            stopViewTracking
        );

        videoElement.addEventListener(
            'waiting',
            stopViewTracking
        );

        videoElement.addEventListener(
            'stalled',
            stopViewTracking
        );

        videoElement.addEventListener(
            'ended',
            stopViewTracking
        );

        videoElement.addEventListener(
            'seeking',
            stopViewTracking
        );

        videoElement.addEventListener(
            'seeked',
            () => {

                if (
                    !videoElement.paused &&
                    videoElement.readyState >= 3
                ) {
                    startViewTracking();
                }
            }
        );


        // =========================================
        // TAB VISIBILITY HANDLING
        // =========================================

        document.addEventListener(
            'visibilitychange',
            () => {

                if (document.hidden) {

                    stopViewTracking();

                } else if (
                    !videoElement.paused &&
                    !videoElement.ended &&
                    videoElement.readyState >= 3
                ) {

                    startViewTracking();
                }
            }
        );


        // =========================================
        // VIDEO PLAYBACK ERROR HANDLING
        // =========================================

        videoElement.addEventListener('error', () => {

            const error = videoElement.error;

            console.error('Video Playback Error:', {
                code: error ? error.code : null,
                message: error ? error.message : 'Unknown error',
                source: videoElement.currentSrc || videoElement.src
            });

            stopViewTracking();
        });


        // =========================================
        // INITIALIZE PLAYER
        // =========================================

        async function initPlayer() {

            try {

                const movieData =
                    await loadMovieData();

                currentMovie = movieData.movie;

                currentMovieId = movieData.movieId;

                safeTitle = movieData.title;

                titleElement.textContent = safeTitle;


                // SEO AND CANONICAL CONFIGURATION

                if (
                    currentMovie &&
                    currentMovieId
                ) {

                    setMovieSEO(
                        currentMovie,
                        currentMovieId,
                        movieData.videoUrl,
                        movieData.imageUrl
                    );

                    addVideoStructuredData(
                        currentMovie,
                        currentMovieId,
                        movieData.videoUrl,
                        movieData.imageUrl
                    );

                } else {

                    document.title =
                        safeTitle + ' - drsamangyi';

                    setIndexable(false);
                }


                // VALIDATE VIDEO URL

                const videoUrl =
                    encodeR2VideoUrl(movieData.videoUrl);


                // SET VIDEO SOURCE

                videoElement.src = videoUrl.href;

                videoElement.load();


                // INITIALIZE PLYR

                if (typeof Plyr === 'undefined') {
                    throw new Error('Plyr library failed to load');
                }

                const player = new Plyr(videoElement, {

                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'settings',
                        'pip',
                        'fullscreen'
                    ]

                });


                // PLAYER EVENT HANDLING

                player.on('ready', () => {
                    console.log(
                        'Plyr Player Initialized Successfully'
                    );
                });

                player.on('playing', () => {
                    console.log('Movie Playback Started');
                });

                player.on('ended', () => {
                    console.log('Movie Playback Completed');
                });


                // INITIALIZE VIEW COUNTER

                generateMovieKey(videoUrl.href)
                    .then(key => {

                        movieKey = key;

                        visitorId = getVisitorId();

                        console.log(
                            'View Counter Initialized'
                        );

                        if (
                            !videoElement.paused &&
                            !videoElement.ended &&
                            !document.hidden &&
                            videoElement.readyState >= 3
                        ) {
                            startViewTracking();
                        }

                    })
                    .catch(error => {

                        console.warn(
                            'View Counter Initialization Failed:',
                            error
                        );

                    });

            } catch (error) {

                console.error(
                    'Player Initialization Error:',
                    error
                );

                setIndexable(false);

                titleElement.textContent =
                    'Unable to load movie. Please try again.';
            }
        }


        // =========================================
        // START PLAYER
        // =========================================

        initPlayer();

    </script>

</body>
</html>
