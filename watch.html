<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - drsamangyi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors flex items-center gap-1">
                ← Back to Home
            </a>
            <h1 id="movieTitle" class="text-sm font-medium text-slate-200 truncate max-w-xs sm:max-w-md">Loading...</h1>
        </div>
    </header>

    <!-- Video Player Container (HTML5 Native Video for R2 MP4 - YouTube လုံးဝမဟုတ်ပါ) -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col justify-center">
        <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative">
            <video id="videoPlayer" controls autoplay class="w-full h-full object-contain">
                Your browser does not support the video tag.
            </video>
        </div>
    </main>

    <!-- Base64 Decoding Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVideo = urlParams.get('v');
        const title = urlParams.get('t');

        if (title) {
            document.getElementById('movieTitle').innerText = decodeURIComponent(title);
        }

        if (encodedVideo) {
            try {
                // Base64 မှ မူရင်း R2 Direct MP4 Link သို့ ပြန်ပြောင်းခြင်း (Decoding)
                const decodedUrl = atob(decodeURIComponent(encodedVideo));
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = decodedUrl;
            } catch (error) {
                console.error('Invalid video token:', error);
                alert('ဗီဒီယိုလင့်ခ် မှားယွင်းနေပါသည်။');
            }
        } else {
            alert('ဇာတ်ကား မတွေ့ရှိပါ။');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
